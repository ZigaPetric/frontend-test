<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipetirna ploščica — Procesni nadzor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">● PROCESNI NADZOR</div>
    <nav>
      <a href="dashboard.html">Nadzorna plošča</a>
      <a href="reports.html">Poročila</a>
      <div class="nav-group-label">Vnos</div>
      <a href="forms/nova-preiskava.html">Nova preiskava</a>
      <a href="forms/zaloga-reagentov.html">Zaloga reagentov</a>
      <div class="nav-group-label">Nastavitve</div>
      <a href="nastavitve/reagenti.html">Reagenti</a>
    </nav>
    <div style="margin-top:auto; padding-top:16px;">
      <button id="logout-btn" class="btn" style="width:100%;">Odjava</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1 id="plate-title">Pipetirna ploščica</h1>
      <a href="dashboard.html" class="btn">← Nazaj</a>
    </div>

    <div class="card" style="margin-bottom:24px;">
      <div class="grid grid-cols-3">
        <div class="field" style="margin-bottom:0;">
          <label for="datum">Datum</label>
          <input type="text" id="datum" readonly>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="izvajal">Izvajal</label>
          <input type="text" id="izvajal" readonly>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="delovna-pozicija">Delovna pozicija</label>
          <select id="delovna-pozicija">
            <option value="1">1</option>
            <option value="2">2</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="plate-scroll">
        <table class="plate-table">
          <thead>
            <tr>
              <th></th><th></th>
              <th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th>
            </tr>
          </thead>
          <tbody id="plate-body">
            <!-- napolni plosca.js -->
          </tbody>
        </table>
      </div>
      <div class="plate-actions">
        <div class="plate-actions-buttons">
          <button id="save-plate" class="btn btn-primary">Shrani ploščico</button>
          <button id="print-plate" class="btn">Natisni</button>
        </div>
        <div class="lot-info" id="lot-info"><!-- napolni plosca.js --></div>
      </div>
      <div id="save-success" class="helptext" style="display:none; color:var(--success); margin-top:8px;">Ploščica je bila shranjena.</div>
    </div>
  </main>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script src="js/plosca.js"></script>
</body>
</html>
