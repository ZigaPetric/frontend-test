<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prijava — Sistem za sledenje procesom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="brand">● PROCESNI NADZOR</div>
    <div class="subtitle">Sledljivost procesov po MBL številki — od priprave do končnega poročila</div>

    <div class="signal-line" aria-hidden="true">
      <svg viewBox="0 0 320 24" xmlns="http://www.w3.org/2000/svg">
        <line x1="0" y1="12" x2="320" y2="12" stroke="#2A333F" stroke-width="1"/>
        <circle cx="20" cy="12" r="3" fill="#FF8A3D"/>
        <circle cx="140" cy="12" r="3" fill="#4FA3D1"/>
        <circle cx="300" cy="12" r="3" fill="#2A333F"/>
      </svg>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Uporabniško ime</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Geslo</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div id="login-error" class="form-error"></div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Prijava</button>
    </form>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
